name: Auto Update Deals

on:
  schedule:
    # Run 4x/day. UTC; site audience EN + ES (US/EU), this covers both mornings.
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-deals
  cancel-in-progress: false

jobs:
  auto-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check live prices and update deals
        run: node auto-deals.js

      - name: Commit and push changes
        # NOTE: pushes made with GITHUB_TOKEN do NOT trigger other workflows,
        # so purge-cache.yml never runs for bot pushes. Cloudflare is purged
        # here directly instead.
        run: |
          git config user.name "tmg-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no_changes=true" >> "$GITHUB_ENV"
          else
            git commit -m "deals: auto refresh live prices [skip ci]"
            git push origin main
            echo "no_changes=false" >> "$GITHUB_ENV"
          fi

      - name: Purge Cloudflare Cache
        if: env.no_changes == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "::warning::Missing Cloudflare secrets (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ZONE_ID). Skipping purge."
            exit 0
          fi
          RESP=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$RESP"
          if echo "$RESP" | grep -q '"success":true'; then
            echo "::notice::Cloudflare cache purged successfully"
          else
            echo "::error::Cloudflare purge failed: $RESP"
            exit 1
          fi